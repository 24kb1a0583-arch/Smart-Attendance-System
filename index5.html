<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Attendance System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

body {
  background: url("https://images.unsplash.com/photo-1523580494863-6f3031224c94") no-repeat center/cover;
  color: white;
}
body::before {
  content:"";
  position:fixed;
  width:100%; height:100%;
  background: rgba(2,6,23,0.85);
  z-index:-1;
}

.container { display:flex; }

.sidebar {
  width:240px;
  background: rgba(30,41,59,0.9);
  height:100vh;
  padding:20px;
}
.sidebar h2 {
  text-align:center;
  color:#22c55e;
  margin-bottom:20px;
}
.sidebar li { padding:10px; cursor:pointer; }

.main { flex:1; padding:30px; }

.section { display:none; }
.section.active { display:block; }

.cards { display:flex; gap:20px; }

.card {
  background: rgba(30,41,59,0.9);
  padding:20px;
  border-radius:10px;
  width:150px;
  text-align:center;
}

input {
  padding:10px;
  margin:10px;
  width:250px;
  border-radius:5px;
  border:none;
}

button {
  padding:10px 15px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
  <h2>Attendance</h2>
  <ul>
    <li onclick="showSection('login')">Login</li>
    <li onclick="showSection('dashboard')">Dashboard</li>
    <li onclick="showSection('admin')">Admin</li>
    <li onclick="showSection('mark')">Manual</li>
    <li onclick="showSection('qr')">QR</li>
    <li onclick="showSection('scanner')">Scanner</li>
  </ul>
</div>

<div class="main">

<!-- LOGIN -->
<div id="login" class="section active">
  <h2>Login</h2>

  <h4>Admin</h4>
  <input id="hmUser" placeholder="Username">
  <input id="hmPass" type="password" placeholder="Password">
  <button onclick="login('hm')">Login</button>
  <button onclick="registerAdmin()">Register</button>

  <h4>Teacher</h4>
  <input id="tUser" placeholder="Username">
  <input id="tPass" type="password" placeholder="Password">
  <button onclick="login('teacher')">Login</button>
  <input id="tBio" placeholder="Biometric ID">
  <button onclick="teacherBioLogin()">Bio Login</button>

  <h4>Student</h4>
  <input id="sUser" placeholder="Username">
  <input id="sPass" type="password" placeholder="Password">
  <button onclick="studentLogin()">Login</button>
  <input id="sBio" placeholder="Biometric ID">
  <button onclick="studentBioLogin()">Bio Login</button>

  <p id="loginStatus"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section">
  <h2>Dashboard</h2>
  <div class="cards">
    <div class="card">Total<br><b id="total">0</b></div>
    <div class="card">Present<br><b id="present">0</b></div>
    <div class="card">Absent<br><b id="absent">0</b></div>
    <div class="card">%<br><b id="percent">0%</b></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin" class="section">
  <h2>Admin Panel</h2>
  <input id="studentName" placeholder="Student Name">
  <input id="rollNumber" placeholder="Roll Number">
  <button onclick="addStudent()">Add Student</button>
  <ul id="studentList"></ul>
</div>

<!-- MANUAL -->
<div id="mark" class="section">
  <h2>Manual Attendance</h2>
  <input id="userRoll" placeholder="Enter Roll Number">
  <button onclick="markAttendance()">Mark</button>
  <p id="status"></p>
</div>

<!-- QR -->
<div id="qr" class="section">
  <h2>QR Generator</h2>
  <input id="qrRoll" placeholder="Enter Roll Number">
  <button onclick="generateQR()">Generate</button>
  <div id="qrBox"></div>
</div>

<!-- SCANNER -->
<div id="scanner" class="section">
  <h2>QR Scanner</h2>
  <button onclick="startScanner()">Start Scanner</button>
  <div id="reader" style="width:300px;"></div>
  <p id="scanResult"></p>
</div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
let students = {};
let present = new Set();

let admins = JSON.parse(localStorage.getItem("admins")) || {};
let teachers = JSON.parse(localStorage.getItem("teachers")) || {
  teacher: { password: "123", bio: "T001" }
};
let studentsLogin = JSON.parse(localStorage.getItem("studentsLogin")) || {
  student1: { password: "111", bio: "S001" }
};

localStorage.setItem("teachers", JSON.stringify(teachers));
localStorage.setItem("studentsLogin", JSON.stringify(studentsLogin));

// Navigation
function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Admin
function registerAdmin(){
  let u = hmUser.value;
  let p = hmPass.value;
  if(!u || !p) return alert("Enter details");
  admins[u]=p;
  localStorage.setItem("admins", JSON.stringify(admins));
  alert("Admin Registered");
}

function login(type){
  if(type==="hm"){
    if(admins[hmUser.value]===hmPass.value){
      loginStatus.innerText="Admin Login Success";
      showSection('dashboard');
    } else loginStatus.innerText="Invalid Admin";
  }

  else if(type==="teacher"){
    if(teachers[tUser.value] && teachers[tUser.value].password===tPass.value){
      loginStatus.innerText="Teacher Login Success";
      showSection('mark');
    } else loginStatus.innerText="Invalid Teacher";
  }
}

// Teacher biometric
function teacherBioLogin(){
  let bio = tBio.value;
  for(let t in teachers){
    if(teachers[t].bio===bio){
      loginStatus.innerText="Teacher Bio Success";
      showSection('mark');
      return;
    }
  }
  loginStatus.innerText="Invalid Bio";
}

// Student login
function studentLogin(){
  if(studentsLogin[sUser.value] && studentsLogin[sUser.value].password===sPass.value){
    loginStatus.innerText="Student Login Success";
    showSection('dashboard');
  } else loginStatus.innerText="Invalid Student";
}

// Student biometric
function studentBioLogin(){
  let bio = sBio.value;
  for(let s in studentsLogin){
    if(studentsLogin[s].bio===bio){
      loginStatus.innerText="Student Bio Success";
      showSection('dashboard');
      return;
    }
  }
  loginStatus.innerText="Invalid Bio";
}

// Add Student
function addStudent(){
  let name = studentName.value;
  let roll = rollNumber.value;
  if(!name || !roll) return alert("Enter fields");
  students[roll]=name;
  let li=document.createElement("li");
  li.innerText=roll+" - "+name;
  studentList.appendChild(li);
  updateDashboard();
}

// Attendance
function markAttendance(){
  let roll=userRoll.value;
  if(!students[roll]) return status.innerText="Not found";
  if(present.has(roll)) return status.innerText="Already marked";
  present.add(roll);
  status.innerText="Marked: "+students[roll];
  updateDashboard();
}

// QR
function generateQR(){
  qrBox.innerHTML="";
  new QRCode(qrBox, qrRoll.value);
}

// Scanner
function startScanner(){
  const qr=new Html5Qrcode("reader");
  Html5Qrcode.getCameras().then(devices=>{
    if(devices.length){
      qr.start(devices[0].id,{fps:10,qrbox:250},text=>{
        if(students[text] && !present.has(text)){
          present.add(text);
          scanResult.innerText="Marked: "+students[text];
          updateDashboard();
        }
      });
    }
  });
}

// Dashboard
function updateDashboard(){
  let total=Object.keys(students).length;
  let pres=present.size;
  let abs=total-pres;
  let percent=total?((pres/total)*100).toFixed(1):0;

  total.innerText=total;
  present.innerText=pres;
  absent.innerText=abs;
  percent.innerText=percent+"%";
}
</script>

</body>
</html>
