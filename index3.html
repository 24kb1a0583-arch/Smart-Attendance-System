<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Attendance System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #020617, #0f172a);
  color: white;
}

.container { display: flex; }

.sidebar {
  width: 240px;
  background: #1e293b;
  height: 100vh;
  padding: 20px;
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 20px;
  color: #22c55e;
}

.sidebar li {
  padding: 10px;
  cursor: pointer;
}

.main { flex: 1; padding: 30px; }

.section { display: none; }
.section.active { display: block; }

.cards {
  display: flex;
  gap: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
  width: 150px;
  text-align: center;
}

input {
  padding: 10px;
  margin: 10px;
  width: 250px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 10px 15px;
  background: #22c55e;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<!-- Sidebar -->
<div class="sidebar">
  <h2>Attendance</h2>
  <ul>
    <li onclick="showSection('login')">Login</li>
    <li onclick="showSection('dashboard')">Dashboard</li>
    <li onclick="showSection('admin')">Admin</li>
    <li onclick="showSection('mark')">Manual</li>
    <li onclick="showSection('qr')">QR Generator</li>
    <li onclick="showSection('scanner')">QR Scanner</li>
  </ul>
</div>

<div class="main">

<!-- LOGIN -->
<div id="login" class="section active">
  <h2>Login</h2>
  <input id="hmUser" placeholder="HM Username">
  <input id="hmPass" type="password" placeholder="Password">
  <button onclick="login('hm')">HM Login</button>

  <input id="tUser" placeholder="Teacher Username">
  <input id="tPass" type="password" placeholder="Password">
  <button onclick="login('teacher')">Teacher Login</button>

  <p id="loginStatus"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section">
  <h2>Dashboard</h2>
  <div class="cards">
    <div class="card">Total<br><b id="total">0</b></div>
    <div class="card">Present<br><b id="present">0</b></div>
    <div class="card">Absent<br><b id="absent">0</b></div>
    <div class="card">%<br><b id="percent">0%</b></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin" class="section">
  <h2>Admin</h2>
  <input id="studentName" placeholder="Student Name">
  <button onclick="addStudent()">Add</button>

  <ul id="studentList"></ul>
</div>

<!-- MANUAL -->
<div id="mark" class="section">
  <h2>Manual Attendance</h2>
  <input id="userId" placeholder="Student Name">
  <button onclick="markAttendance()">Mark</button>
  <p id="status"></p>
</div>

<!-- QR GENERATOR -->
<div id="qr" class="section">
  <h2>QR Generator</h2>
  <input id="qrName" placeholder="Student Name">
  <button onclick="generateQR()">Generate</button>
  <div id="qrBox"></div>
</div>

<!-- SCANNER -->
<div id="scanner" class="section">
  <h2>QR Scanner</h2>
  <button onclick="startScanner()">Start Scanner</button>
  <div id="reader" style="width:300px;"></div>
  <p id="scanResult"></p>
</div>

</div>
</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
let students = [];
let present = new Set();

// Navigation
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Login
function login(type) {
  if(type==="hm" && hmUser.value==="admin" && hmPass.value==="admin123"){
    loginStatus.innerText="HM Login Success";
    showSection('dashboard');
  }
  else if(type==="teacher" && tUser.value==="teacher" && tPass.value==="123"){
    loginStatus.innerText="Teacher Login Success";
    showSection('mark');
  }
  else loginStatus.innerText="Invalid Login";
}

// Add student
function addStudent() {
  let name = studentName.value;
  if(!name) return;

  students.push(name);

  let li = document.createElement("li");
  li.innerText = name;
  studentList.appendChild(li);

  updateDashboard();
}

// Manual attendance
function markAttendance() {
  let name = userId.value;
  if(!name) return;

  present.add(name);
  status.innerText="Marked " + name;

  updateDashboard();
}

// QR generate
function generateQR() {
  let name = qrName.value;
  if(!name) return;

  qrBox.innerHTML="";
  new QRCode(qrBox, name);
}

// QR scanner (FIXED)
function startScanner() {
  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    if (devices.length) {
      html5QrCode.start(
        devices[0].id,
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          present.add(decodedText);
          scanResult.innerText = "Scanned: " + decodedText;
          updateDashboard();
        }
      );
    }
  }).catch(err => {
    alert("Camera Error: " + err);
  });
}

// Dashboard update
function updateDashboard() {
  let total = students.length;
  let pres = present.size;
  let abs = total - pres;
  let percent = total===0 ? 0 : ((pres/total)*100).toFixed(1);

  document.getElementById("total").innerText = total;
  document.getElementById("present").innerText = pres;
  document.getElementById("absent").innerText = abs;
  document.getElementById("percent").innerText = percent + "%";
}
</script>

</body>
</html>
