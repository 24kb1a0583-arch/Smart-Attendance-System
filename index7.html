<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Attendance System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<!-- Face API -->
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body {
  background: url("https://images.unsplash.com/photo-1523580494863-6f3031224c94") no-repeat center/cover;
  color: white;
}
body::before {
  content:"";
  position:fixed;
  width:100%; height:100%;
  background: rgba(2,6,23,0.85);
  z-index:-1;
}
.container { display:flex; }
.sidebar {
  width:240px;
  background: rgba(30,41,59,0.9);
  height:100vh;
  padding:20px;
}
.sidebar h2 { text-align:center; color:#22c55e; margin-bottom:20px; }
.sidebar li { padding:10px; cursor:pointer; list-style:none; color:white; }
.sidebar li:hover { background:#334155; border-radius:5px; }
.main { flex:1; padding:30px; }
.section { display:none; }
.section.active { display:block; }
.cards { display:flex; gap:20px; }
.card {
  background: rgba(30,41,59,0.9);
  padding:20px;
  border-radius:10px;
  width:150px;
  text-align:center;
}
input { padding:10px; margin:10px 0; width:250px; border-radius:5px; border:none; }
button { padding:10px 15px; background:#22c55e; border:none; color:white; border-radius:5px; cursor:pointer; }
button:hover { background:#16a34a; }
p.status { margin-top:10px; font-weight:bold; }
video { border:2px solid #22c55e; border-radius:5px; margin-top:10px; }
</style>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <h2>Attendance</h2>
    <ul>
      <li onclick="showSection('login')">Login/Register</li>
      <li onclick="showSection('dashboard')">Dashboard</li>
      <li onclick="showSection('admin')">Admin Panel</li>
      <li onclick="showSection('mark')">Manual Attendance</li>
    </ul>
  </div>

  <div class="main">

    <!-- LOGIN & REGISTER -->
    <div id="login" class="section active">
      <h2>Login / Register</h2>
      <select id="userType">
        <option value="admin">Admin</option>
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
      </select><br>
      <input id="user" placeholder="Username">
      <input id="pass" type="password" placeholder="Password"><br>
      <input id="bio" placeholder="Biometric ID (optional for Teacher/Student)"><br>
      <button onclick="register()">Register</button>
      <button onclick="login()">Login</button>
      <h3>Camera Biometric Login</h3>
      <video id="video" width="320" height="240" autoplay muted></video><br>
      <button onclick="startCamera()">Start Camera</button>
      <button onclick="captureFace()">Login with Face</button>
      <p id="loginStatus" class="status"></p>
      <p id="faceStatus" class="status"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="section">
      <h2>Dashboard</h2>
      <div class="cards">
        <div class="card">Total<br><b id="total">0</b></div>
        <div class="card">Present<br><b id="present">0</b></div>
        <div class="card">Absent<br><b id="absent">0</b></div>
        <div class="card">%<br><b id="percent">0%</b></div>
      </div>
    </div>

    <!-- ADMIN -->
    <div id="admin" class="section">
      <h2>Admin Panel</h2>
      <input id="studentName" placeholder="Student Name">
      <input id="rollNumber" placeholder="Roll Number">
      <button onclick="addStudent()">Add Student</button>
      <ul id="studentList"></ul>
    </div>

    <!-- MANUAL ATTENDANCE -->
    <div id="mark" class="section">
      <h2>Manual Attendance</h2>
      <input id="userRoll" placeholder="Enter Roll Number">
      <button onclick="markAttendance()">Mark</button>
      <p id="status" class="status"></p>
    </div>

  </div>
</div>

<script>
let students = {};
let present = new Set();
let users = JSON.parse(localStorage.getItem("users")) || {};

// Navigation
function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Register
function register(){
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;
  const type = document.getElementById('userType').value;
  const bio = document.getElementById('bio').value;
  const status = document.getElementById('loginStatus');

  if(!u || !p){ status.style.color="red"; status.innerText="Enter username & password"; return; }
  if(users[u]){ status.style.color="red"; status.innerText="Username already exists!"; return; }

  users[u] = { password: p, role: type };
  if(type !== "admin" && bio) users[u].bio = bio;
  localStorage.setItem("users", JSON.stringify(users));
  status.style.color="lightgreen";
  status.innerText=type+" registered successfully!";
}

// Login with password
function login(){
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;
  const status = document.getElementById('loginStatus');

  if(users[u] && users[u].password === p){
    status.style.color = "lightgreen";
    status.innerText = u + " login successful!";
    redirectPanel(users[u].role);
  } else {
    status.style.color = "red";
    status.innerText = "Invalid username or password";
  }
}

// FaceAPI camera login
async function startCamera(){
  await faceapi.nets.tinyFaceDetector.loadFromUri('https://justademos.github.io/face-api/models/');
  await faceapi.nets.faceRecognitionNet.loadFromUri('https://justademos.github.io/face-api/models/');
  await faceapi.nets.faceLandmark68Net.loadFromUri('https://justademos.github.io/face-api/models/');
  
  const video = document.getElementById('video');
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => video.srcObject = stream)
    .catch(err => console.error("Camera error: ", err));
}

async function captureFace(){
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  const detection = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
  const status = document.getElementById('faceStatus');

  if(!detection){
    status.style.color="red";
    status.innerText = "Face not detected!";
    return;
  }

  const storedFace = localStorage.getItem('demoFace');
  if(!storedFace){
    localStorage.setItem('demoFace', JSON.stringify(Array.from(detection.descriptor)));
    status.style.color="lightgreen";
    status.innerText = "Face registered! Now try login.";
    return;
  }

  const storedDescriptor = new Float32Array(JSON.parse(storedFace));
  const distance = faceapi.euclideanDistance(storedDescriptor, detection.descriptor);

  if(distance < 0.6){
    status.style.color="lightgreen";
    status.innerText = "Face recognized! Login success.";
    showSection('dashboard'); // You can redirectPanel if needed
  } else {
    status.style.color="red";
    status.innerText = "Face not recognized!";
  }
}

// Redirect to panel based on role
function redirectPanel(role){
  if(role === "admin") showSection('admin');
  else if(role === "teacher") showSection('mark');
  else showSection('dashboard');
}

// ADMIN: Add Student
function addStudent(){
  let name = document.getElementById('studentName').value;
  let roll = document.getElementById('rollNumber').value;
  if(!name || !roll) return alert("Enter fields");
  students[roll] = name;

  let li = document.createElement("li");
  li.innerText = roll + " - " + name;
  document.getElementById('studentList').appendChild(li);

  updateDashboard();
}

// Manual attendance
function markAttendance(){
  let roll = document.getElementById('userRoll').value;
  const status = document.getElementById('status');
  if(!students[roll]){
    status.style.color = "red";
    return status.innerText = "Student not found";
  }
  if(present.has(roll)){
    status.style.color = "orange";
    return status.innerText = "Already marked";
  }
  present.add(roll);
  status.style.color = "lightgreen";
  status.innerText = "Attendance marked: " + students[roll];
  updateDashboard();
}

// Dashboard
function updateDashboard(){
  let total = Object.keys(students).length;
  let pres = present.size;
  let abs = total - pres;
  let percent = total ? ((pres/total)*100).toFixed(1) : 0;

  document.getElementById('total').innerText = total;
  document.getElementById('present').innerText = pres;
  document.getElementById('absent').innerText = abs;
  document.getElementById('percent').innerText = percent + "%";
}
</script>

</body>
</html>
